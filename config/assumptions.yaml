project:
  name: "Life Insurance Pricing & Profitability Engine"
  version: "0.1.0"

product:
  product_type: "20-year level term"
  issue_age_min: 25
  issue_age_max: 60
  term_years: 20
  premium_mode: "annual"
  benefit_timing: "end_of_year"
  face_amount_min: 100000
  face_amount_max: 1000000

mortality:
  # NOTE (Loop 3): the raw files actually available under data/raw/ are the
  # SOA 2015 VBT Smoker Distinct select-and-ultimate tables (Table Identity
  # 3265 family), not the 2017 CSO tables originally targeted in the Loop 1
  # draft of this document. This value was corrected to match the real
  # source data rather than silently keeping an inaccurate label -- see
  # docs/DATA_SOURCES.md for the full explanation.
  reference_basis: "2015 VBT Smoker Distinct tables (SOA mort.soa.org), select & ultimate, by sex and smoker status"
  # Underwriting-class relativities derived from the SOA "Individual Life
  # Experience Committee (ILEC) 2012-2019 Mortality Experience Report"
  # appendices, Appendix K1 (nonsmoker A/E-to-2015-VBT by underwriting-class
  # rank and face-amount band). These replace the original Loop 3
  # illustrative guesses (flat 0.60/0.80/1.00) -- see docs/DATA_SOURCES.md
  # for the exact source cells and methodology.
  #
  # Loop 12b refinement: split from one flat multiplier per class into
  # face-amount-band-specific multipliers, since Appendix K1's raw data
  # shows the relativity is NOT constant across face amount (better classes
  # separate more from Standard at lower face amounts than at higher ones).
  # Each band's A/E ratio was also claims-count-weighted across Appendix
  # K1's duration-group columns (using the "Number of Policy Claims" block
  # on the same sheet as weights) rather than a simple average, applying
  # limited-fluctuation-credibility logic so heavily-populated duration
  # cells influence the relativity more than sparse ones. Every policy's
  # face_amount (a required PROJECT_SPEC.md dimension, in
  # [product.face_amount_min, product.face_amount_max]) must fall in
  # exactly one band; validated in life_pricing.config.validate_assumptions.
  underwriting_class_multiplier_by_face_band:
    - face_amount_min: 100000
      face_amount_max: 249999
      multipliers:
        "Preferred Plus": 0.6541
        "Preferred": 0.7588
        "Standard": 1.0000
    - face_amount_min: 250000
      face_amount_max: 499999
      multipliers:
        "Preferred Plus": 0.6433
        "Preferred": 0.7602
        "Standard": 1.0000
    - face_amount_min: 500000
      face_amount_max: 1000000
      multipliers:
        "Preferred Plus": 0.6146
        "Preferred": 0.7182
        "Standard": 1.0000
  stress_multiplier: 1.0

lapse:
  # Replaced (Loop 12 rigor upgrade) with the real 20-Year level term
  # lapse-rate-by-duration curve from the SOA "2009-13 US Individual Life
  # Persistency Update", sheet "Term -Part 1", the "20-Year level term"
  # Policy Lapse Rate block. Durations 1-19 are the observed lapse rates
  # for the level-premium period; duration 20 (0.31) is the well-known
  # "shock lapse" at the end of the level-premium period, when premiums
  # jump to attained-age rates and most surviving, non-converting
  # policyholders let the policy lapse. See docs/DATA_SOURCES.md for the
  # exact source cells.
  by_duration:
    1: 0.06
    2: 0.055
    3: 0.047
    4: 0.043
    5: 0.04
    6: 0.037
    7: 0.034
    8: 0.032
    9: 0.031
    10: 0.03
    11: 0.03
    12: 0.027
    13: 0.027
    14: 0.025
    15: 0.027
    16: 0.029
    17: 0.029
    18: 0.034
    19: 0.042
    20: 0.31

interest:
  # Loop 12 rigor upgrade: replaced the original arbitrary 4.0% illustrative
  # rate with a real, publicly cited risk-free rate anchor -- the 20-Year
  # Treasury Constant Maturity yield (FRED series DGS20), 5.16% as of
  # 2026-08-25, chosen for its ~20-year duration match to this product's
  # term. This is a risk-free proxy, not a company's actual net investment
  # income assumption (a real insurer would typically earn a spread over
  # Treasuries from an investment-grade corporate bond portfolio backing
  # reserves) -- see docs/DATA_SOURCES.md for the citation and rationale,
  # and MODEL_LIMITATIONS.md for why this remains a simplification.
  annual_effective_rate: 0.0516

expenses:
  acquisition_fixed: 150.0
  acquisition_pct_first_year_premium: 0.25
  renewal_pct_premium: 0.05
  maintenance_per_inforce_year: 60.0

profit:
  target_pv_margin: 0.10

synthetic_data:
  random_seed: 20260827
  n_policies: 10000
  # V1 illustrative portfolio-composition assumptions (Loop 4). These shape
  # only the synthetic book of business, not pricing/mortality -- but are
  # still declared here rather than hard-coded, per this project's
  # assumption-governance rule.
  sex_distribution:
    male: 0.50
    female: 0.50
  smoker_distribution:
    nonsmoker: 0.85
    smoker: 0.15
  # Must match the underwriting-class categories declared in every band of
  # mortality.underwriting_class_multiplier_by_face_band exactly (validated
  # in life_pricing.config.validate_assumptions).
  underwriting_class_distribution:
    "Preferred Plus": 0.20
    "Preferred": 0.40
    "Standard": 0.40
  distribution_channel:
    "Career Agent": 0.35
    "Independent Agent": 0.35
    "Direct to Consumer": 0.15
    "Broker Dealer": 0.15
  state_region:
    "Northeast": 0.20
    "Midwest": 0.22
    "South": 0.35
    "West": 0.23
  issue_year_min: 2016
  issue_year_max: 2025
  face_amount_round_to: 10000

# Loop 8 (experience analytics) needs a stochastic "actual" outcome per
# policy to compare against the pricing assumptions above (the "expected"
# basis). Since this project has no real policyholder experience data, that
# actual outcome is simulated using a separately declared "true" basis --
# NOT a pricing assumption, and never used by the pricing engine (Loops
# 2-7). See ACTUARIAL_ASSUMPTIONS.md for the full explanation.
experience_simulation:
  # Replaced (Loop 12 rigor upgrade): true_mortality_multiplier is now a
  # duration-keyed curve rather than one flat scalar, derived from the SOA
  # ILEC 2012-2019 Mortality Experience Report, Appendix H (20-year term,
  # actual-to-2015-VBT-expected ratios by duration). Appendix H's most
  # recent issue-year cohort (2010-2017) does not yet have observed
  # experience past duration 10, so durations 11-20 are spliced in from the
  # next-older issue-year cohort (2000-2009) at the same durations -- the
  # only cohort with full 1-20 duration coverage in the report. This is a
  # splicing simplification, documented in full (with exact appendix cells)
  # in docs/DATA_SOURCES.md. This remains simulation-only input for the
  # Loop 8 A/E analytics engine -- it is NEVER read by the pricing engine
  # (Loops 2-7), per AGENTS.md's actual-vs-expected labeling rule.
  true_mortality_multiplier_by_duration:
    1: 0.8525
    2: 0.8576
    3: 0.9093
    4: 0.8064
    5: 0.8064
    6: 0.7902
    7: 0.7902
    8: 0.7902
    9: 0.7902
    10: 0.7902
    11: 0.7525
    12: 0.7525
    13: 0.7525
    14: 0.7525
    15: 0.7525
    16: 0.7354
    17: 0.7354
    18: 0.7354
    19: 0.7354
    20: 0.7354
  # true_lapse_multiplier_by_duration (Loop 12b): replaced the flat,
  # illustrative 0.85 scalar with a real, duration-varying curve. The
  # pricing (expected) lapse basis above already consumes the SOA 2009-13
  # Persistency Update's combined-risk-class "20-Year level term" figures,
  # so it cannot also serve as an independent "actual" comparison. Instead,
  # this uses a genuinely different real cut of the SAME underlying 2009-13
  # study: sheet "Term - Part 3" ("By Risk Classification"), the "20-year
  # Level Term, Standard" column, which is reported separately from the
  # blended figure used as the pricing basis. Standard was chosen because
  # it is the only one of the three reported risk classes (Preferred /
  # Standard / Substandard) with data at every duration 1-20; Preferred and
  # Substandard have no reported experience for durations 18-20 (too little
  # exposure to report). See docs/DATA_SOURCES.md for the exact source
  # cells and the resulting ratio-to-expected-lapse derivation.
  true_lapse_multiplier_by_duration:
    1: 1.4667
    2: 1.2909
    3: 1.2553
    4: 1.2326
    5: 1.225
    6: 1.1081
    7: 1.0294
    8: 1.0
    9: 1.0
    10: 1.0667
    11: 1.0667
    12: 1.0741
    13: 1.037
    14: 1.04
    15: 1.0
    16: 1.0345
    17: 1.2069
    18: 1.2353
    19: 1.1667
    20: 0.5484
